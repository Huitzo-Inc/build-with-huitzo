# In a real pack this file is generated from huitzo.yaml by `huitzo pack sync`.
# It is committed here so the example is self-contained and CI can install it.
[project]
name = "expense-triage"
version = "0.1.0"
description = "Three commands behind an expense triage app: list, classify, approve."
requires-python = ">=3.11"
dependencies = ["huitzo-sdk>=1.0.0"]
authors = [{ name = "Huitzo" }]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "mypy>=1.0", "ruff>=0.1"]

[project.entry-points."huitzo.commands"]
"@reef/expense-triage/list-expenses" = "expense_triage.commands.list_expenses:list_expenses"
"@reef/expense-triage/classify-expense" = "expense_triage.commands.classify_expense:classify_expense"
"@reef/expense-triage/approve-expense" = "expense_triage.commands.approve_expense:approve_expense"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
