schema_version: 1

dashboard:
  name: expense-triage
  namespace: reef
  version: 0.1.1
  description: "Expense triage: list, classify, and approve expenses, powered by the expense-triage pack."
  visibility: private
  category: productivity
  icon: "receipt"

# The dashboard half is coupled to the pack half ONLY through these command ids.
# Same project, two artifacts, one contract.
pack_dependencies:
  - scope: "@reef"
    name: expense-triage
    version: "*"
    required: true

build:
  framework: react
  entry_point: main.js
  min_sdk_version: "4.0.0"
