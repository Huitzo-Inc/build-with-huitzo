# In a real pack this file is generated from huitzo.yaml by `huitzo pack sync`.
# It is committed here so the example is self-contained and CI can install it.
[project]
name = "trade-surveillance"
version = "0.1.0"
description = "A governed market-abuse surveillance pack: Python detects and decides, an eval guards, the model only narrates the alert."
requires-python = ">=3.11"
dependencies = ["huitzo-sdk>=1.0.0"]
authors = [{ name = "Huitzo" }]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "mypy>=1.0", "ruff>=0.1"]

[project.entry-points."huitzo.commands"]
"@reef/trade-surveillance/screen-trade" = "trade_surveillance.commands.screen_trade:screen_trade"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
