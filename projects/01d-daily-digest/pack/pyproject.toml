# In a real pack this file is generated from huitzo.yaml by `huitzo pack sync`.
# It is committed here so the example is self-contained and CI can install it.
[project]
name = "daily-digest"
version = "0.1.0"
description = "Raw daily sales CSV in, plain-language digest plus one anomaly flag out -- every number computed in Python."
requires-python = ">=3.11"
dependencies = ["huitzo-sdk>=1.0.0"]
authors = [{ name = "Huitzo" }]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "mypy>=1.0", "ruff>=0.1"]

[project.entry-points."huitzo.commands"]
"@reef/daily-digest/daily-digest" = "daily_digest.commands.daily_digest:daily_digest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
