name: test-web-and-clients

# The pack pytest suites run in test-packs.yml. This workflow covers everything that
# is not a Python pack: every React dashboard in the repo, and the outside-in client
# code (Tier 5).
#
# The dashboard matrix is DISCOVERED, not hardcoded. Adding projects/<name>/dashboard
# is enough to get it built and tested — there is no list to remember to update.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dashboards: ${{ steps.find.outputs.dashboards }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Find every dashboard in the repo
        run: |
          set -euo pipefail
          dirs=$(find projects -mindepth 2 -maxdepth 2 -type d -name dashboard \
                 | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "dashboards=$dirs" >> "$GITHUB_OUTPUT"
          echo "Discovered: $dirs"
          if [ "$dirs" = "[]" ]; then echo "No dashboards found"; exit 1; fi

  dashboards:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.dashboards) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - name: Typecheck and build the dashboard bundle
        run: npm run build
      - name: Run the offline component tests
        run: npm test
      - name: Run the publish preflight, where a rung defines one
        # D6 ships a preflight that inspects the built bundle and the manifest.
        # Run it wherever it exists so it cannot rot; skip silently elsewhere.
        run: |
          if node -e "process.exit(require('./package.json').scripts?.preflight ? 0 : 1)"; then
            node scripts/preflight.mjs
          else
            echo "no preflight script — skipping"
          fi

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/05-pack-from-outside/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Run the offline client tests
        run: python -m pytest -q
