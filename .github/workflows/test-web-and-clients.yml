name: test-web-and-clients

# The pack pytest suites run in test-packs.yml. This workflow covers the two rungs
# that are not Python packs: the React dashboards (Tiers 4 and 6) and the outside-in
# client code (Tier 5).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dashboards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [04-first-dashboard, 06-fullstack-triage]
    defaults:
      run:
        working-directory: projects/${{ matrix.dir }}/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Typecheck and build the dashboard bundle
        run: npm run build
      - name: Run the offline component tests
        run: npm test

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/05-pack-from-outside/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Run the offline client tests
        run: python -m pytest -q
